services:
  - type: web
    name: parking-server
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: DEVICE_SALT
        generateValue: true
      - key: ADMIN_TOKEN_ALBERT
        sync: false   # à saisir dans le tableau de bord Render (jeton long et aléatoire) ; ADMIN_TOKEN accepté en repli
      - key: TURSO_DATABASE_URL
        sync: false   # libsql://… (créée dans le tableau de bord Turso)
      - key: TURSO_AUTH_TOKEN
        sync: false   # jeton Turso (lecture/écriture, sans expiration ou long)
